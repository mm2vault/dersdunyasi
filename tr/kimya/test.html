<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimya Testi - DersDünyası</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="light-mode">
    <div class="theme-toggle">
        <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="navbar">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="../../index.html">🏠 Ana Sayfa</a>
            <a href="../index.html">📚 Türkçe Dersler</a>
            <a href="index.html">🧪 Kimya</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>📝 Kimya Testi</h1>
            <p>10 Soru | Süre: 15 Dakika</p>
        </div>

        <div id="timerContainer" style="text-align: center; margin-bottom: 30px;">
            <div class="timer" id="timer">15:00</div>
        </div>

        <div id="quizContainer" class="quiz-container"></div>
    </div>

    <script src="../../script.js"></script>
    <script>
        const testQuestions = [
            {
                question: "1. Atomun merkezinde ne bulunur?",
                options: ["A) Elektron", "B) Proton ve Nötron", "C) Sayısız elektron", "D) Foton"],
                correctAnswer: 1
            },
            {
                question: "2. Aynı elementten farklı sayıda nötron içeren atomlar ne denir?",
                options: ["A) İyonlar", "B) İzotoplar", "C) Moleküller", "D) Radikallar"],
                correctAnswer: 1
            },
            {
                question: "3. pH 7 olan bir çözelti ne diye adlandırılır?",
                options: ["A) Asidik", "B) Bazik", "C) Nötr", "D) Tampon"],
                correctAnswer: 2
            },
            {
                question: "4. H₂O formülünde 2 ne anlamına gelir?",
                options: ["A) 2 molekül", "B) İyonlaşma derecesi", "C) 2 hidrojen atomu", "D) Yüklü parçacık"],
                correctAnswer: 2
            },
            {
                question: "5. Organik bileşiklerin temeli ne elementtir?",
                options: ["A) Azot", "B) Oksijen", "C) Karbon", "D) Fosfor"],
                correctAnswer: 2
            },
            {
                question: "6. Redoks reaksiyonunda elektron kazanan atom/ion ne olur?",
                options: ["A) İndirgen", "B) Oksidasyona uğrar", "C) İndirgenir", "D) Yükseltgenir"],
                correctAnswer: 2
            },
            {
                question: "7. Katalist reaksiyonda ne yapar?",
                options: ["A) Enerji sağlar", "B) Etkinleştirme enerjisini azaltır", "C) Isı üretir", "D) Ürün oluşturur"],
                correctAnswer: 1
            },
            {
                question: "8. İyonik bağ ne arasında oluşur?",
                options: ["A) Atom ile atom", "B) Metal ile metal", "C) Metal ile metalmeyen", "D) Merkez çekirdek ile elektron"],
                correctAnswer: 2
            },
            {
                question: "9. Avogadro sayısı kaçtır?",
                options: ["A) 6.02 × 10²²", "B) 6.02 × 10²⁴", "C) 6.02 × 10²³", "D) 6.02 × 10²⁵"],
                correctAnswer: 2
            },
            {
                question: "10. Isı müfrit reaksiyonlar ne tür reaksiyonlardır?",
                options: ["A) Endotermik", "B) Ekzotermik", "C) Nötr", "D) Sınır"],
                correctAnswer: 1
            }
        ];

        let quiz = new QuizEngine(testQuestions, 15 * 60);
        window.quizEngine = quiz;

        window.addEventListener('load', function() {
            quiz.startTimer();
            renderQuestion(quiz);
        });
    </script>
</body>
</html>
