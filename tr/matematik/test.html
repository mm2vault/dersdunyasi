<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Testi - DersDünyası</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="light-mode">
    <div class="theme-toggle">
        <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="navbar">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="../../index.html">🏠 Ana Sayfa</a>
            <a href="../index.html">📚 Türkçe Dersler</a>
            <a href="index.html">📐 Matematik</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>📝 Matematik Testi</h1>
            <p>10 Soru | Süre: 15 Dakika | Her Soru 10 Puan</p>
        </div>

        <div id="timerContainer" style="text-align: center; margin-bottom: 30px;">
            <div class="timer" id="timer">15:00</div>
        </div>

        <div id="quizContainer" class="quiz-container"></div>
    </div>

    <script src="../../script.js"></script>
    <script>
        const testQuestions = [
            {
                question: "1. x + 5 = 12 ise x kaçtır?",
                options: ["A) 5", "B) 7", "C) 10", "D) 17"],
                correctAnswer: 1
            },
            {
                question: "2. Kenarları 5cm olan karenin alanı kaç cm²dir?",
                options: ["A) 10", "B) 20", "C) 25", "D) 30"],
                correctAnswer: 2
            },
            {
                question: "3. sin(90°) kaçtır?",
                options: ["A) 0", "B) 0.5", "C) 1", "D) -1"],
                correctAnswer: 2
            },
            {
                question: "4. f(x) = x² ise f'(x) nedir?",
                options: ["A) x", "B) 2x", "C) x/2", "D) 1"],
                correctAnswer: 1
            },
            {
                question: "5. 2x² - 5x + 3 = 0 denkleminin çözümleri nelerdir?",
                options: ["A) 1 ve 1.5", "B) 2 ve 3", "C) 0 ve 1", "D) -1 ve -1.5"],
                correctAnswer: 0
            },
            {
                question: "6. Bir üçgenin tabanı 6 cm, yüksekliği 4 cm ise alanı kaç cm²?",
                options: ["A) 10", "B) 12", "C) 24", "D) 20"],
                correctAnswer: 1
            },
            {
                question: "7. cos(0°) kaçtır?",
                options: ["A) 0", "B) 0.5", "C) 1", "D) -1"],
                correctAnswer: 2
            },
            {
                question: "8. Veri seti: 2, 4, 4, 4, 5 ise ortalaması kaçtır?",
                options: ["A) 3.8", "B) 4", "C) 4.2", "D) 5"],
                correctAnswer: 0
            },
            {
                question: "9. ∫x² dx nedir?",
                options: ["A) x³/3 + C", "B) x³ + C", "C) 2x + C", "D) x + C"],
                correctAnswer: 0
            },
            {
                question: "10. Bir dairenin yarıçapı 3 cm ise çevresi kaç cm? (π≈3.14)",
                options: ["A) 9.42", "B) 18.84", "C) 28.26", "D) 6.28"],
                correctAnswer: 1
            }
        ];

        let quiz = new QuizEngine(testQuestions, 15 * 60); // 15 dakika
        window.quizEngine = quiz;

        window.addEventListener('load', function() {
            quiz.startTimer();
            renderQuestion(quiz);
        });
    </script>
</body>
</html>
